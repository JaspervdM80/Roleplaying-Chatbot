<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat pictures, phone</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&amp;display=swap">
<style>
body{margin:0;background:#0b0910}
:root{--surface-page:#110e17;--surface-card:#1a1622;--surface-raised:#241f2e;--primary:#f0739b;--on-primary:#1d0a13;--accent:#f2b56b;--info:#7cb7ff;--ink:rgba(236,230,242,.92);--ink-muted:rgba(236,230,242,.7);--ink-subtle:rgba(236,230,242,.52);--line:rgba(236,230,242,.12);--line-strong:rgba(236,230,242,.22);--font-ui:'Figtree',system-ui,sans-serif;--font-prose:'Atkinson Hyperlegible',system-ui,sans-serif;--ink-soft:rgba(236,230,242,.82);--ink-faint:rgba(236,230,242,.36);--error:#ff6b7a;--selected:rgba(236,230,242,.12)}
a{color:#f0739b}a:hover{color:#f59ab6}
</style>
</head>
<body>
<div style="width: 375px; height: 812px; display: flex; flex-direction: column; background: var(--surface-page); color: var(--ink); font-family: var(--font-ui); overflow: hidden">
  <header style="flex-shrink: 0; height: 104px; box-sizing: border-box; padding: 44px 4px 0; display: flex; align-items: center; gap: 4px">
    <a href="chat-images-phone.html" aria-label="Back to the chat" style="width: 44px; height: 44px; border-radius: 10px; color: var(--ink-muted); display: grid; place-items: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a>
    <div style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0">
      <h1 style="margin: 0; font-size: 16px; font-weight: 700">Pictures</h1>
      <span style="font-size: 12px; color: var(--ink-subtle)">The Lantern Inn · Snowed in at the pass</span>
    </div>
  </header>

  <div role="group" aria-label="Show" style="flex-shrink: 0; display: flex; gap: 8px; padding: 4px 16px 12px; overflow: hidden; border-bottom: 1px solid var(--line)">
    <button type="button" aria-pressed="true" style="height: 44px; box-sizing: border-box; padding: 0 16px; border-radius: 999px; background: var(--selected); color: var(--ink); font-weight: 600; border: 1px solid transparent; font: inherit; font-size: 14px; display: flex; align-items: center; gap: 8px">All<span style="color: var(--ink-subtle); font-weight: 500">9</span></button>
    <button type="button" aria-pressed="false" style="flex-shrink: 0; height: 44px; box-sizing: border-box; padding: 0 14px 0 6px; border-radius: 999px; border: 1px solid var(--line); background: none; color: var(--ink-muted); font: inherit; font-size: 14px; display: flex; align-items: center; gap: 8px"><div aria-hidden="true" style="width: 30px; height: 30px; flex-shrink: 0; border-radius: 50%; overflow: hidden; background: linear-gradient(165deg, #4a2a44 0%, #1b1424 100%)"><svg width="30" height="30" viewBox="18 26 84 84" style="display: block"><circle cx="60" cy="60" r="25" fill="rgba(240,115,155,.4)"/><path d="M12 160c4-40 24-62 48-62s44 22 48 62z" fill="rgba(240,115,155,.3)"/></svg></div>Mira</button>
    <button type="button" aria-pressed="false" style="flex-shrink: 0; height: 44px; box-sizing: border-box; padding: 0 14px 0 6px; border-radius: 999px; border: 1px solid var(--line); background: none; color: var(--ink-muted); font: inherit; font-size: 14px; display: flex; align-items: center; gap: 8px"><div aria-hidden="true" style="width: 30px; height: 30px; flex-shrink: 0; border-radius: 50%; overflow: hidden; background: linear-gradient(165deg, #24304a 0%, #1b1424 100%)"><svg width="30" height="30" viewBox="18 26 84 84" style="display: block"><circle cx="60" cy="60" r="25" fill="rgba(124,183,255,.4)"/><path d="M12 160c4-40 24-62 48-62s44 22 48 62z" fill="rgba(124,183,255,.3)"/></svg></div>Thorne</button>
  </div>

  <div style="flex-grow: 1; min-height: 0; overflow: hidden; padding: 16px 16px 0; display: flex; flex-direction: column; gap: 12px">
    <h2 style="margin: 0; font-size: 13px; font-weight: 600; color: var(--ink-subtle)">Tonight</h2>
    <div style="display: grid; grid-template-columns: repeat(3, 109px); gap: 8px">
      <div role="status" aria-label="Drawing a picture" style="width: 109px; height: 145px; box-sizing: border-box; border: 1px dashed var(--line-strong); border-radius: 8px; background: var(--surface-raised); display: grid; place-items: center; color: var(--ink-muted)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9" opacity=".9"/></svg></div>

      <a href="image-viewer-phone.html" aria-label="Mira at the bar" style="position: relative; display: block; width: 109px; height: 145px; border-radius: 8px; overflow: hidden"><div aria-hidden="true" style="width: 109px; height: 145px; background: linear-gradient(165deg, #4a2a44 0%, #241a2e 55%, #17121f 100%)"><svg width="109" height="145" viewBox="0 0 120 160" preserveAspectRatio="xMidYMid slice" style="display: block"><circle cx="60" cy="60" r="25" fill="rgba(240,115,155,.34)"/><path d="M12 160c4-40 24-62 48-62s44 22 48 62z" fill="rgba(240,115,155,.26)"/></svg></div><span aria-label="Reference portrait" style="position: absolute; left: 6px; top: 6px; width: 22px; height: 22px; border-radius: 50%; background: rgba(17,14,23,.8); display: grid; place-items: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="#f2b56b" aria-hidden="true"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg></span></a>
      <a href="image-viewer-phone.html" aria-label="Thorne at the corner table" style="position: relative; display: block; width: 109px; height: 145px; border-radius: 8px; overflow: hidden"><div aria-hidden="true" style="width: 109px; height: 145px; background: linear-gradient(165deg, #24304a 0%, #241a2e 55%, #17121f 100%)"><svg width="109" height="145" viewBox="0 0 120 160" preserveAspectRatio="xMidYMid slice" style="display: block"><circle cx="60" cy="60" r="25" fill="rgba(124,183,255,.34)"/><path d="M12 160c4-40 24-62 48-62s44 22 48 62z" fill="rgba(124,183,255,.26)"/></svg></div></a>
      <a href="image-viewer-phone.html" aria-label="The loft" style="position: relative; display: block; width: 109px; height: 145px; border-radius: 8px; overflow: hidden"><svg width="109" height="145" viewBox="0 0 160 90" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="display: block"><defs><radialGradient id="glow12" cx=".3" cy=".55" r=".6"><stop offset="0" stop-color="#f2b56b" stop-opacity=".55"/><stop offset="1" stop-color="#f2b56b" stop-opacity="0"/></radialGradient></defs><rect width="160" height="90" fill="#1c1520"/><path d="M0 0h160L80 -20z" fill="#000"/><path d="M0 30 80 0l80 30v60H0z" fill="#2a1f28"/><rect width="160" height="90" fill="url(#glow12)"/><rect x="28" y="56" width="44" height="14" rx="2" fill="#3b2a30"/><rect x="92" y="56" width="44" height="14" rx="2" fill="#3b2a30"/><circle cx="48" cy="46" r="2.4" fill="#f2b56b"/></svg></a>
    </div>
    <h2 style="margin: 8px 0 0; font-size: 13px; font-weight: 600; color: var(--ink-subtle)">Yesterday</h2>
    <div style="display: grid; grid-template-columns: repeat(3, 109px); gap: 8px">
      <a href="image-viewer-phone.html" aria-label="The pass at dusk" style="position: relative; display: block; width: 109px; height: 145px; border-radius: 8px; overflow: hidden"><svg width="109" height="145" viewBox="0 0 160 90" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="display: block"><defs><linearGradient id="sky13" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c3756"/><stop offset="1" stop-color="#7d8db3"/></linearGradient></defs><rect width="160" height="90" fill="url(#sky13)"/><path d="M0 62 34 28l22 20 26-30 34 34 18-14 26 24v28H0z" fill="#46506e"/><path d="M0 72c30-8 60-6 90-2s50 2 70-4v24H0z" fill="#d9deea"/><rect x="104" y="52" width="26" height="20" fill="#2a2030"/><path d="M100 54h34l-17-12z" fill="#e7ebf3"/><rect x="113" y="60" width="7" height="7" fill="#f2b56b"/><g fill="#fff" opacity=".7"><circle cx="20" cy="14" r=".9"/><circle cx="48" cy="22" r=".7"/><circle cx="76" cy="10" r=".9"/><circle cx="96" cy="30" r=".7"/><circle cx="132" cy="16" r=".9"/><circle cx="150" cy="36" r=".7"/><circle cx="62" cy="40" r=".8"/></g></svg></a>
      <a href="image-viewer-phone.html" aria-label="Thorne with his map" style="position: relative; display: block; width: 109px; height: 145px; border-radius: 8px; overflow: hidden"><div aria-hidden="true" style="width: 109px; height: 145px; background: linear-gradient(165deg, #24304a 0%, #241a2e 55%, #17121f 100%)"><svg width="109" height="145" viewBox="0 0 120 160" preserveAspectRatio="xMidYMid slice" style="display: block"><circle cx="60" cy="60" r="25" fill="rgba(124,183,255,.34)"/><path d="M12 160c4-40 24-62 48-62s44 22 48 62z" fill="rgba(124,183,255,.26)"/></svg></div></a>
      <a href="image-viewer-phone.html" aria-label="Arrival" style="position: relative; display: block; width: 109px; height: 145px; border-radius: 8px; overflow: hidden"><svg width="109" height="145" viewBox="0 0 160 90" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="display: block"><defs><radialGradient id="hearth14" cx=".76" cy=".78" r=".55"><stop offset="0" stop-color="#f2b56b" stop-opacity=".7"/><stop offset=".5" stop-color="#f0739b" stop-opacity=".18"/><stop offset="1" stop-color="#f0739b" stop-opacity="0"/></radialGradient></defs><rect width="160" height="90" fill="#1d1826"/><rect x="16" y="12" width="28" height="34" rx="2" fill="#3b4b70"/><path d="M30 12v34M16 29h28" stroke="#1d1826" stroke-width="1.5"/><g fill="#fff" opacity=".75"><circle cx="21" cy="18" r=".8"/><circle cx="36" cy="22" r=".7"/><circle cx="25" cy="36" r=".8"/><circle cx="40" cy="40" r=".7"/></g><rect y="66" width="160" height="24" fill="#150f16"/><rect width="160" height="90" fill="url(#hearth14)"/><rect x="108" y="48" width="30" height="22" rx="2" fill="#2a1a1c"/><path d="M114 70c2-8 6-12 9-16 3 4 7 8 9 16z" fill="#f2b56b"/><g fill="rgba(5,4,8,.55)"><circle cx="66" cy="50" r="6"/><path d="M56 72c1-10 5-15 10-15s9 5 10 15z"/><circle cx="88" cy="48" r="6"/><path d="M78 72c1-10 5-16 10-16s9 6 10 16z"/></g><rect x="50" y="64" width="56" height="4" rx="1" fill="#3a2a2c"/></svg></a>
      <a href="image-viewer-phone.html" aria-label="Mira" style="position: relative; display: block; width: 109px; height: 145px; border-radius: 8px; overflow: hidden"><div aria-hidden="true" style="width: 109px; height: 145px; background: linear-gradient(165deg, #4a2a44 0%, #241a2e 55%, #17121f 100%)"><svg width="109" height="145" viewBox="0 0 120 160" preserveAspectRatio="xMidYMid slice" style="display: block"><circle cx="60" cy="60" r="25" fill="rgba(240,115,155,.34)"/><path d="M12 160c4-40 24-62 48-62s44 22 48 62z" fill="rgba(240,115,155,.26)"/></svg></div></a>
    </div>

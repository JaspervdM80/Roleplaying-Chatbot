<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Character pictures, desktop</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&amp;display=swap">
<style>
body{margin:0;background:#0b0910}
:root{--surface-page:#110e17;--surface-card:#1a1622;--surface-raised:#241f2e;--surface-sunken:#0b0910;--primary:#f0739b;--on-primary:#1d0a13;--accent:#f2b56b;--info:#7cb7ff;--error:#ff6b7a;--ink:rgba(236,230,242,.92);--ink-muted:rgba(236,230,242,.7);--ink-subtle:rgba(236,230,242,.52);--ink-faint:rgba(236,230,242,.36);--line:rgba(236,230,242,.12);--line-strong:rgba(236,230,242,.22);--hover:rgba(236,230,242,.06);--selected:rgba(236,230,242,.12);--font-ui:'Figtree',system-ui,sans-serif;--font-prose:'Atkinson Hyperlegible',system-ui,sans-serif;--ink-soft:rgba(236,230,242,.82)}
a{color:#f0739b}a:hover{color:#f59ab6}
</style>
</head>
<body>
<div style="width: 1280px; height: 800px; display: flex; background: var(--surface-page); color: var(--ink); font-family: var(--font-ui); overflow: hidden">

  <nav aria-label="Main" style="width: 64px; flex-shrink: 0; box-sizing: border-box; padding: 14px 0; display: flex; flex-direction: column; align-items: center; gap: 6px; background: var(--surface-card); border-right: 1px solid var(--line)">
    <div style="width: 32px; height: 32px; margin-bottom: 14px; border-radius: 9px; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; font-family: var(--font-prose); font-size: 21px; font-weight: 700; font-style: italic">R</div>
    <a href="#" aria-label="Chats" style="width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
    </a>
    <a href="#" aria-label="Chatbots" style="width: 44px; height: 44px; border-radius: 10px; color: var(--ink-muted); display: grid; place-items: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
    </a>
    <a href="#" aria-label="Characters" aria-current="page" style="width: 44px; height: 44px; border-radius: 10px; background: var(--selected); color: var(--primary); display: grid; place-items: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    </a>
    <a href="#" aria-label="Personas" style="width: 44px; height: 44px; border-radius: 10px; color: var(--ink-muted); display: grid; place-items: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg>
    </a>
    <div style="flex-grow: 1"></div>
    <a href="#" aria-label="Models" style="width: 44px; height: 44px; border-radius: 10px; color: var(--ink-muted); display: grid; place-items: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M15 2v2M15 20v2M2 15h2M2 9h2M20 15h2M20 9h2M9 2v2M9 20v2"/></svg>
    </a>
    <a href="#" aria-label="Account" style="width: 36px; height: 36px; margin-top: 4px; border-radius: 50%; background: var(--surface-raised); color: var(--accent); display: grid; place-items: center; text-decoration: none; font-size: 13px; font-weight: 700">S</a>
  </nav>

  <main style="flex-grow: 1; min-width: 0; box-sizing: border-box; padding: 24px 40px; display: flex; flex-direction: column; gap: 20px; overflow: hidden">
    <div style="display: flex; align-items: center; gap: 16px">
      <a href="#" aria-label="Back to characters" style="width: 44px; height: 44px; margin-left: -12px; border-radius: 10px; color: var(--ink-muted); display: grid; place-items: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a>
      <div aria-hidden="true" style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 50%; overflow: hidden; background: linear-gradient(165deg, #4a2a44 0%, #1b1424 100%)"><svg width="48" height="48" viewBox="18 26 84 84" style="display: block"><circle cx="60" cy="60" r="25" fill="rgba(240,115,155,.4)"/><path d="M12 160c4-40 24-62 48-62s44 22 48 62z" fill="rgba(240,115,155,.3)"/></svg></div>
      <div style="flex-grow: 1; display: flex; flex-direction: column">
        <h1 style="margin: 0; font-size: 24px; font-weight: 700">Mira</h1>
        <span style="font-size: 14px; color: var(--ink-subtle)">Pictures · 9</span>
      </div>
      <button type="button" style="height: 44px; padding: 0 16px; border: 1px solid var(--line-strong); border-radius: 10px; background: none; color: var(--ink); font: inherit; font-size: 14px; font-weight: 600">Edit character</button>
      <button type="button" style="height: 44px; padding: 0 16px; border: 0; border-radius: 10px; background: var(--primary); color: var(--on-primary); font: inherit; font-size: 14px; font-weight: 600">Generate portrait</button>
    </div>

    <div role="group" aria-label="Show" style="display: flex; gap: 8px">
      <button type="button" aria-pressed="true" style="height: 44px; box-sizing: border-box; padding: 0 16px; border-radius: 999px; background: var(--selected); color: var(--ink); font-weight: 600; border: 1px solid transparent; font: inherit; font-size: 14px; display: flex; align-items: center; gap: 8px">All<span style="color: var(--ink-subtle); font-weight: 500">9</span></button>
      <button type="button" aria-pressed="false" style="height: 44px; box-sizing: border-box; padding: 0 16px; border-radius: 999px; background: none; color: var(--ink-muted); font-weight: 500; border: 1px solid var(--line); font: inherit; font-size: 14px; display: flex; align-items: center; gap: 8px">Portraits<span style="color: var(--ink-subtle); font-weight: 500">3</span></button>
      <button type="button" aria-pressed="false" style="height: 44px; box-sizing: border-box; padding: 0 16px; border-radius: 999px; background: none; color: var(--ink-muted); font-weight: 500; border: 1px solid var(--line); font: inherit; font-size: 14px; display: flex; align-items: center; gap: 8px">From chats<span style="color: var(--ink-subtle); font-weight: 500">6</span></button>
    </div>

    <div style="display: grid; grid-template-columns: repeat(6, 168px); gap: 16px">
      <a href="image-viewer-desktop.html" aria-label="Reference portrait" style="position: relative; display: block; width: 168px; height: 224px; border-radius: 10px; overflow: hidden"><div aria-hidden="true" style="width: 168px; height: 224px; background: linear-gradient(165deg, #4a2a44 0%, #241a2e 55%, #17121f 100%)"><svg width="168" height="224" viewBox="0 0 120 160" preserveAspectRatio="xMidYMid slice" style="display: block"><circle cx="60" cy="60" r="25" fill="rgba(240,115,155,.34)"/><path d="M12 160c4-40 24-62 48-62s44 22 48 62z" fill="rgba(240,115,155,.26)"/></svg></div><span style="position: absolute; left: 8px; top: 8px; height: 24px; padding: 0 8px; border-radius: 999px; background: rgba(17,14,23,.8); color: var(--ink); font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 5px"><svg width="12" height="12" viewBox="0 0 24 24" fill="#f2b56b" aria-hidden="true"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg>Reference</span></a>
      <div role="status" aria-label="Drawing a portrait" style="width: 168px; height: 224px; box-sizing: border-box; border: 1px dashed var(--line-strong); border-radius: 10px; background: var(--surface-raised); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--ink-muted); font-size: 13px; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9" opacity=".9"/></svg>Drawing…</div>
      <a href="image-viewer-desktop.html" aria-label="Portrait" style="position: relative; display: block; width: 168px; height: 224px; border-radius: 10px; overflow: hidden"><div aria-hidden="true" style="width: 168px; height: 224px; background: linear-gradient(165deg, #4a2a44 0%, #241a2e 55%, #17121f 100%)"><svg width="168" height="224" viewBox="0 0 120 160" preserveAspectRatio="xMidYMid slice" style="display: block"><circle cx="60" cy="60" r="25" fill="rgba(240,115,155,.34)"/><path d="M12 160c4-40 24-62 48-62s44 22 48 62z" fill="rgba(240,115,155,.26)"/></svg></div></a>
      <a href="image-viewer-desktop.html" aria-label="The common room" style="position: relative; display: block; width: 168px; height: 224px; border-radius: 10px; overflow: hidden"><svg width="168" height="224" viewBox="0 0 160 90" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="display: block"><defs><radialGradient id="hearth6" cx=".76" cy=".78" r=".55"><stop offset="0" stop-color="#f2b56b" stop-opacity=".7"/><stop offset=".5" stop-color="#f0739b" stop-opacity=".18"/><stop offset="1" stop-color="#f0739b" stop-opacity="0"/></radialGradient></defs><rect width="160" height="90" fill="#1d1826"/><rect x="16" y="12" width="28" height="34" rx="2" fill="#3b4b70"/><path d="M30 12v34M16 29h28" stroke="#1d1826" stroke-width="1.5"/><g fill="#fff" opacity=".75"><circle cx="21" cy="18" r=".8"/><circle cx="36" cy="22" r=".7"/><circle cx="25" cy="36" r=".8"/><circle cx="40" cy="40" r=".7"/></g><rect y="66" width="160" height="24" fill="#150f16"/><rect width="160" height="90" fill="url(#hearth6)"/><rect x="108" y="48" width="30" height="22" rx="2" fill="#2a1a1c"/><path d="M114 70c2-8 6-12 9-16 3 4 7 8 9 16z" fill="#f2b56b"/><g fill="rgba(5,4,8,.55)"><circle cx="66" cy="50" r="6"/><path d="M56 72c1-10 5-15 10-15s9 5 10 15z"/><circle cx="88" cy="48" r="6"/><path d="M78 72c1-10 5-16 10-16s9 6 10 16z"/></g><rect x="50" y="64" width="56" height="4" rx="1" fill="#3a2a2c"/></svg><span style="position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 10px 8px; background: linear-gradient(transparent, rgba(8,7,11,.85)); font-size: 12px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Snowed in at the pass</span></a>
      <a href="image-viewer-desktop.html" aria-label="The loft" style="position: relative; display: block; width: 168px; height: 224px; border-radius: 10px; overflow: hidden"><svg width="168" height="224" viewBox="0 0 160 90" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="display: block"><defs><radialGradient id="glow7" cx=".3" cy=".55" r=".6"><stop offset="0" stop-color="#f2b56b" stop-opacity=".55"/><stop offset="1" stop-color="#f2b56b" stop-opacity="0"/></radialGradient></defs><rect width="160" height="90" fill="#1c1520"/><path d="M0 0h160L80 -20z" fill="#000"/><path d="M0 30 80 0l80 30v60H0z" fill="#2a1f28"/><rect width="160" height="90" fill="url(#glow7)"/><rect x="28" y="56" width="44" height="14" rx="2" fill="#3b2a30"/><rect x="92" y="56" width="44" height="14" rx="2" fill="#3b2a30"/><circle cx="48" cy="46" r="2.4" fill="#f2b56b"/></svg><span style="position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 10px 8px; background: linear-gradient(transparent, rgba(8,7,11,.85)); font-size: 12px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Snowed in at the pass</span></a>
      <a href="image-viewer-desktop.html" aria-label="Mira at the bar" style="position: relative; display: block; width: 168px; height: 224px; border-radius: 10px; overflow: hidden"><div aria-hidden="true" style="width: 168px; height: 224px; background: linear-gradient(165deg, #4a2a44 0%, #241a2e 55%, #17121f 100%)"><svg width="168" height="224" viewBox="0 0 120 160" preserveAspectRatio="xMidYMid slice" style="display: block"><circle cx="60" cy="60" r="25" fill="rgba(240,115,155,.34)"/><path d="M12 160c4-40 24-62 48-62s44 22 48 62z" fill="rgba(240,115,155,.26)"/></svg></div><span style="position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 10px 8px; background: linear-gradient(transparent, rgba(8,7,11,.85)); font-size: 12px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Market day</span></a>
      <a href="image-viewer-desktop.html" aria-label="The pass" style="position: relative; display: block; width: 168px; height: 224px; border-radius: 10px; overflow: hidden"><svg width="168" height="224" viewBox="0 0 160 90" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="display: block"><defs><linearGradient id="sky8" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c3756"/><stop offset="1" stop-color="#7d8db3"/></linearGradient></defs><rect width="160" height="90" fill="url(#sky8)"/><path d="M0 62 34 28l22 20 26-30 34 34 18-14 26 24v28H0z" fill="#46506e"/><path d="M0 72c30-8 60-6 90-2s50 2 70-4v24H0z" fill="#d9deea"/><rect x="104" y="52" width="26" height="20" fill="#2a2030"/><path d="M100 54h34l-17-12z" fill="#e7ebf3"/><rect x="113" y="60" width="7" height="7" fill="#f2b56b"/><g fill="#fff" opacity=".7"><circle cx="20" cy="14" r=".9"/><circle cx="48" cy="22" r=".7"/><circle cx="76" cy="10" r=".9"/><circle cx="96" cy="30" r=".7"/><circle cx="132" cy="16" r=".9"/><circle cx="150" cy="36" r=".7"/><circle cx="62" cy="40" r=".8"/></g></svg><span style="position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 10px 8px; background: linear-gradient(transparent, rgba(8,7,11,.85)); font-size: 12px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Market day</span></a>
      <a href="image-viewer-desktop.html" aria-label="Portrait" style="position: relative; display: block; width: 168px; height: 224px; border-radius: 10px; overflow: hidden"><div aria-hidden="true" style="width: 168px; height: 224px; background: linear-gradient(165deg, #4a2a44 0%, #241a2e 55%, #17121f 100%)"><svg width="168" height="224" viewBox="0 0 120 160" preserveAspectRatio="xMidYMid slice" style="display: block"><circle cx="60" cy="60" r="25" fill="rgba(240,115,155,.34)"/><path d="M12 160c4-40 24-62 48-62s44 22 48 62z" fill="rgba(240,115,155,.26)"/></svg></div></a>
      <a href="image-viewer-desktop.html" aria-label="Supper" style="position: relative; display: block; width: 168px; height: 224px; border-radius: 10px; overflow: hidden"><svg width="168" height="224" viewBox="0 0 160 90" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="display: block"><defs><radialGradient id="hearth9" cx=".76" cy=".78" r=".55"><stop offset="0" stop-color="#f2b56b" stop-opacity=".7"/><stop offset=".5" stop-color="#f0739b" stop-opacity=".18"/><stop offset="1" stop-color="#f0739b" stop-opacity="0"/></radialGradient></defs><rect width="160" height="90" fill="#1d1826"/><rect x="16" y="12" width="28" height="34" rx="2" fill="#3b4b70"/><path d="M30 12v34M16 29h28" stroke="#1d1826" stroke-width="1.5"/><g fill="#fff" opacity=".75"><circle cx="21" cy="18" r=".8"/><circle cx="36" cy="22" r=".7"/><circle cx="25" cy="36" r=".8"/><circle cx="40" cy="40" r=".7"/></g><rect y="66" width="160" height="24" fill="#150f16"/><rect width="160" height="90" fill="url(#hearth9)"/><rect x="108" y="48" width="30" height="22" rx="2" fill="#2a1a1c"/><path d="M114 70c2-8 6-12 9-16 3 4 7 8 9 16z" fill="#f2b56b"/><g fill="rgba(5,4,8,.55)"><circle cx="66" cy="50" r="6"/><path d="M56 72c1-10 5-15 10-15s9 5 10 15z"/><circle cx="88" cy="48" r="6"/><path d="M78 72c1-10 5-16 10-16s9 6 10 16z"/></g><rect x="50" y="64" width="56" height="4" rx="1" fill="#3a2a2c"/></svg><span style="position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 10px 8px; background: linear-gradient(transparent, rgba(8,7,11,.85)); font-size: 12px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Market day</span></a>
      <a href="image-viewer-desktop.html" aria-label="Lantern light" style="position: relative; display: block; width: 168px; height: 224px; border-radius: 10px; overflow: hidden"><svg width="168" height="224" viewBox="0 0 160 90" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="display: block"><defs><radialGradient id="glow10" cx=".3" cy=".55" r=".6"><stop offset="0" stop-color="#f2b56b" stop-opacity=".55"/><stop offset="1" stop-color="#f2b56b" stop-opacity="0"/></radialGradient></defs><rect width="160" height="90" fill="#1c1520"/><path d="M0 0h160L80 -20z" fill="#000"/><path d="M0 30 80 0l80 30v60H0z" fill="#2a1f28"/><rect width="160" height="90" fill="url(#glow10)"/><rect x="28" y="56" width="44" height="14" rx="2" fill="#3b2a30"/><rect x="92" y="56" width="44" height="14" rx="2" fill="#3b2a30"/><circle cx="48" cy="46" r="2.4" fill="#f2b56b"/></svg><span style="position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 10px 8px; background: linear-gradient(transparent, rgba(8,7,11,.85)); font-size: 12px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Market day</span></a>
    </div>
  </main>
</div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Picture viewer, phone</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&amp;display=swap">
<style>
body{margin:0;background:#0b0910}
:root{--surface-page:#110e17;--surface-card:#1a1622;--surface-raised:#241f2e;--primary:#f0739b;--on-primary:#1d0a13;--accent:#f2b56b;--info:#7cb7ff;--ink:rgba(236,230,242,.92);--ink-muted:rgba(236,230,242,.7);--ink-subtle:rgba(236,230,242,.52);--line:rgba(236,230,242,.12);--line-strong:rgba(236,230,242,.22);--font-ui:'Figtree',system-ui,sans-serif;--font-prose:'Atkinson Hyperlegible',system-ui,sans-serif;--ink-soft:rgba(236,230,242,.82);--ink-faint:rgba(236,230,242,.36);--error:#ff6b7a;--selected:rgba(236,230,242,.12)}
a{color:#f0739b}a:hover{color:#f59ab6}
</style>
</head>
<body>
<div role="dialog" aria-label="Picture" style="width: 375px; height: 812px; display: flex; flex-direction: column; background: #08070b; color: var(--ink); font-family: var(--font-ui); overflow: hidden">
  <header style="flex-shrink: 0; height: 100px; box-sizing: border-box; padding: 44px 4px 0 4px; display: flex; align-items: center; gap: 4px">
    <button type="button" aria-label="Close" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: none; color: var(--ink); display: grid; place-items: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    <div style="flex-grow: 1; display: flex; flex-direction: column">
      <span style="font-size: 15px; font-weight: 600">Mira</span>
      <span style="font-size: 12px; color: var(--ink-subtle)">3 of 9 · tonight, 21:20</span>
    </div>
    <button type="button" aria-label="About this picture" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: none; color: var(--ink); display: grid; place-items: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></button>
  </header>

  <div style="flex-grow: 1; display: grid; place-items: center">
    <div style="width: 375px; height: 500px; overflow: hidden"><div aria-hidden="true" style="width: 375px; height: 500px; background: linear-gradient(165deg, #4a2a44 0%, #241a2e 55%, #17121f 100%)"><svg width="375" height="500" viewBox="0 0 120 160" preserveAspectRatio="xMidYMid slice" style="display: block"><circle cx="60" cy="60" r="25" fill="rgba(240,115,155,.34)"/><path d="M12 160c4-40 24-62 48-62s44 22 48 62z" fill="rgba(240,115,155,.26)"/></svg></div></div>
  </div>

  <div style="flex-shrink: 0; display: flex; justify-content: center; gap: 8px; padding-bottom: 8px" aria-hidden="true">
    <span style="width: 6px; height: 6px; border-radius: 50%; background: var(--ink-faint)"></span>
    <span style="width: 6px; height: 6px; border-radius: 50%; background: var(--ink-faint)"></span>
    <span style="width: 6px; height: 6px; border-radius: 50%; background: var(--ink)"></span>
    <span style="width: 6px; height: 6px; border-radius: 50%; background: var(--ink-faint)"></span>
  </div>

  <nav aria-label="Picture actions" style="flex-shrink: 0; box-sizing: border-box; padding: 4px 8px 34px; display: flex; border-top: 1px solid var(--line)">
    <button type="button" aria-pressed="true" style="flex: 1 1 0; height: 56px; border: 0; background: none; color: var(--accent); font: inherit; font-size: 12px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px"><svg width="22" height="22" viewBox="0 0 24 24" fill="#f2b56b" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg>Reference</button>
    <button type="button" style="flex: 1 1 0; height: 56px; border: 0; background: none; color: var(--ink); font: inherit; font-size: 12px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>Again</button>
    <button type="button" style="flex: 1 1 0; height: 56px; border: 0; background: none; color: var(--ink); font: inherit; font-size: 12px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>Save</button>
    <button type="button" style="flex: 1 1 0; height: 56px; border: 0; background: none; color: var(--ink); font: inherit; font-size: 12px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 15h10l1-15"/></svg>Delete</button>
  </nav>
</div>
</body>
</html>

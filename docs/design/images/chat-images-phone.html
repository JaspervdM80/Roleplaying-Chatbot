<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pictures in the chat, phone</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&amp;display=swap">
<style>
body{margin:0;background:#0b0910}
:root{--surface-page:#110e17;--surface-card:#1a1622;--surface-raised:#241f2e;--primary:#f0739b;--on-primary:#1d0a13;--accent:#f2b56b;--info:#7cb7ff;--ink:rgba(236,230,242,.92);--ink-muted:rgba(236,230,242,.7);--ink-subtle:rgba(236,230,242,.52);--line:rgba(236,230,242,.12);--line-strong:rgba(236,230,242,.22);--font-ui:'Figtree',system-ui,sans-serif;--font-prose:'Atkinson Hyperlegible',system-ui,sans-serif;--ink-soft:rgba(236,230,242,.82);--ink-faint:rgba(236,230,242,.36);--error:#ff6b7a;--selected:rgba(236,230,242,.12)}
a{color:#f0739b}a:hover{color:#f59ab6}
</style>
</head>
<body>
<div style="width: 375px; height: 812px; display: flex; flex-direction: column; background: var(--surface-page); color: var(--ink); font-family: var(--font-ui); overflow: hidden">

  <header style="flex-shrink: 0; height: 104px; box-sizing: border-box; padding: 44px 4px 0; display: flex; align-items: center; gap: 4px; border-bottom: 1px solid var(--line)">
    <a href="#" aria-label="Back to chats" style="width: 44px; height: 44px; border-radius: 10px; color: var(--ink-muted); display: grid; place-items: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <div style="display: flex; flex-shrink: 0; margin-right: 6px">
      <div style="width: 30px; height: 30px; border-radius: 50%; border: 2px solid #110e17; background: rgba(240,115,155,.18); color: var(--primary); display: grid; place-items: center; font-size: 11px; font-weight: 700">M</div>
      <div style="width: 30px; height: 30px; margin-left: -10px; border-radius: 50%; border: 2px solid #110e17; background: rgba(124,183,255,.18); color: var(--info); display: grid; place-items: center; font-size: 11px; font-weight: 700">T</div>
      <div style="width: 30px; height: 30px; margin-left: -10px; border-radius: 50%; border: 2px solid #110e17; background: rgba(242,181,107,.18); color: var(--accent); display: grid; place-items: center; font-size: 11px; font-weight: 700">B</div>
    </div>
    <div style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0">
      <h1 style="margin: 0; font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">The Lantern Inn</h1>
      <span style="font-size: 12px; color: var(--ink-subtle); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Common room · late evening</span>
    </div>
    <a href="../chat/scene-drawer-phone.html" aria-label="Scene" style="width: 44px; height: 44px; border-radius: 10px; color: var(--ink-muted); display: grid; place-items: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M15 3v18"/></svg>
    </a>
  </header>

  <div style="flex-grow: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 16px 14px; gap: 16px">
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 6px">
            <a href="image-viewer-phone.html" aria-label="Open picture: The common room, snowed in" style="display: block; width: 343px; height: 193px; border-radius: 12px; overflow: hidden; border: 1px solid var(--line)"><svg width="343" height="193" viewBox="0 0 160 90" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="display: block"><defs><radialGradient id="hearth4" cx=".76" cy=".78" r=".55"><stop offset="0" stop-color="#f2b56b" stop-opacity=".7"/><stop offset=".5" stop-color="#f0739b" stop-opacity=".18"/><stop offset="1" stop-color="#f0739b" stop-opacity="0"/></radialGradient></defs><rect width="160" height="90" fill="#1d1826"/><rect x="16" y="12" width="28" height="34" rx="2" fill="#3b4b70"/><path d="M30 12v34M16 29h28" stroke="#1d1826" stroke-width="1.5"/><g fill="#fff" opacity=".75"><circle cx="21" cy="18" r=".8"/><circle cx="36" cy="22" r=".7"/><circle cx="25" cy="36" r=".8"/><circle cx="40" cy="40" r=".7"/></g><rect y="66" width="160" height="24" fill="#150f16"/><rect width="160" height="90" fill="url(#hearth4)"/><rect x="108" y="48" width="30" height="22" rx="2" fill="#2a1a1c"/><path d="M114 70c2-8 6-12 9-16 3 4 7 8 9 16z" fill="#f2b56b"/><g fill="rgba(5,4,8,.55)"><circle cx="66" cy="50" r="6"/><path d="M56 72c1-10 5-15 10-15s9 5 10 15z"/><circle cx="88" cy="48" r="6"/><path d="M78 72c1-10 5-16 10-16s9 6 10 16z"/></g><rect x="50" y="64" width="56" height="4" rx="1" fill="#3a2a2c"/></svg></a>
            <figcaption style="font-size: 12px; color: var(--ink-subtle)">The common room, snowed in</figcaption>
          </figure>

    <div style="align-self: flex-end; max-width: 86%; display: flex; flex-direction: column; align-items: flex-end; gap: 4px">
      <span style="font-size: 12px; font-weight: 600; color: var(--ink-subtle)">Wren</span>
      <p style="margin: 0; padding: 10px 14px; border-radius: 16px 16px 4px 16px; background: rgba(240,115,155,.12); border: 1px solid rgba(240,115,155,.24); font-family: var(--font-prose); font-size: 17px; line-height: 1.55">"I'll take the loft."</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px">
      <div style="display: flex; align-items: center; gap: 8px">
        <div aria-hidden="true" style="width: 26px; height: 26px; flex-shrink: 0; border-radius: 50%; overflow: hidden; background: linear-gradient(165deg, #4a2a44 0%, #1b1424 100%)"><svg width="26" height="26" viewBox="18 26 84 84" style="display: block"><circle cx="60" cy="60" r="25" fill="rgba(240,115,155,.4)"/><path d="M12 160c4-40 24-62 48-62s44 22 48 62z" fill="rgba(240,115,155,.3)"/></svg></div>
        <span style="font-size: 14px; font-weight: 600; color: var(--primary)">Mira</span>
      </div>
      <p style="margin: 0; font-family: var(--font-prose); font-size: 17px; line-height: 1.6">"Then it's settled." <em style="color: var(--ink-soft)">She unhooks a lantern and starts up the stairs.</em></p>
    </div>

    <div style="display: flex; gap: 8px">
    <figure aria-busy="true" style="margin: 0; display: flex; flex-direction: column; gap: 6px">
            <div role="status" style="position: relative; width: 206px; height: 275px; box-sizing: border-box; border: 1px dashed var(--line-strong); border-radius: 12px; overflow: hidden; background: linear-gradient(110deg, rgba(236,230,242,.03) 20%, rgba(236,230,242,.09) 40%, rgba(236,230,242,.03) 60%), var(--surface-raised); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--ink-muted)">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9" opacity=".9"/></svg>
              <span style="font-size: 13px; font-weight: 600">Drawing the picture…</span>
              <span style="max-width: 80%; text-align: center; font-size: 12px; line-height: 1.4; color: var(--ink-subtle)">Mira on the loft stairs, lantern in hand</span>
              <button type="button" style="position: absolute; right: 6px; bottom: 6px; height: 44px; padding: 0 12px; border: 0; border-radius: 8px; background: none; color: var(--ink-muted); font: inherit; font-size: 13px; font-weight: 600">Cancel</button>
            </div>
          </figure>
    </div>
  </div>

  <div style="flex-shrink: 0; box-sizing: border-box; padding: 8px 12px 34px; background: var(--surface-page); border-top: 1px solid var(--line)">
    <div style="display: flex; align-items: flex-end; gap: 8px; padding: 6px 6px 6px 14px; border-radius: 14px; background: var(--surface-card); border: 1px solid var(--line-strong)">
      <span style="flex-grow: 1; padding: 10px 0; font-family: var(--font-prose); font-size: 17px; color: var(--ink-faint)">Write as Wren…</span>
      <button type="button" aria-label="Send" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: var(--primary); color: var(--on-primary); display: grid; place-items: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
  </div>
</div>
</body>
</html>

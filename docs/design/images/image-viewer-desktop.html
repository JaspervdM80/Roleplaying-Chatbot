<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Picture viewer, desktop</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&amp;display=swap">
<style>
body{margin:0;background:#0b0910}
:root{--surface-page:#110e17;--surface-card:#1a1622;--surface-raised:#241f2e;--surface-sunken:#0b0910;--primary:#f0739b;--on-primary:#1d0a13;--accent:#f2b56b;--info:#7cb7ff;--error:#ff6b7a;--ink:rgba(236,230,242,.92);--ink-muted:rgba(236,230,242,.7);--ink-subtle:rgba(236,230,242,.52);--ink-faint:rgba(236,230,242,.36);--line:rgba(236,230,242,.12);--line-strong:rgba(236,230,242,.22);--hover:rgba(236,230,242,.06);--selected:rgba(236,230,242,.12);--font-ui:'Figtree',system-ui,sans-serif;--font-prose:'Atkinson Hyperlegible',system-ui,sans-serif;--ink-soft:rgba(236,230,242,.82)}
a{color:#f0739b}a:hover{color:#f59ab6}
</style>
</head>
<body>
<div role="dialog" aria-label="Picture" style="width: 1280px; height: 800px; display: flex; background: var(--surface-sunken); color: var(--ink); font-family: var(--font-ui); overflow: hidden">

  <div style="position: relative; flex-grow: 1; display: grid; place-items: center">
    <div style="width: 816px; height: 459px; border-radius: 6px; overflow: hidden"><svg width="816" height="459" viewBox="0 0 160 90" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="display: block"><defs><radialGradient id="hearth5" cx=".76" cy=".78" r=".55"><stop offset="0" stop-color="#f2b56b" stop-opacity=".7"/><stop offset=".5" stop-color="#f0739b" stop-opacity=".18"/><stop offset="1" stop-color="#f0739b" stop-opacity="0"/></radialGradient></defs><rect width="160" height="90" fill="#1d1826"/><rect x="16" y="12" width="28" height="34" rx="2" fill="#3b4b70"/><path d="M30 12v34M16 29h28" stroke="#1d1826" stroke-width="1.5"/><g fill="#fff" opacity=".75"><circle cx="21" cy="18" r=".8"/><circle cx="36" cy="22" r=".7"/><circle cx="25" cy="36" r=".8"/><circle cx="40" cy="40" r=".7"/></g><rect y="66" width="160" height="24" fill="#150f16"/><rect width="160" height="90" fill="url(#hearth5)"/><rect x="108" y="48" width="30" height="22" rx="2" fill="#2a1a1c"/><path d="M114 70c2-8 6-12 9-16 3 4 7 8 9 16z" fill="#f2b56b"/><g fill="rgba(5,4,8,.55)"><circle cx="66" cy="50" r="6"/><path d="M56 72c1-10 5-15 10-15s9 5 10 15z"/><circle cx="88" cy="48" r="6"/><path d="M78 72c1-10 5-16 10-16s9 6 10 16z"/></g><rect x="50" y="64" width="56" height="4" rx="1" fill="#3a2a2c"/></svg></div>
    <button type="button" aria-label="Previous picture" style="position: absolute; left: 20px; top: 378px; width: 44px; height: 44px; border: 0; border-radius: 50%; background: rgba(236,230,242,.1); color: var(--ink); display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
    <button type="button" aria-label="Next picture" style="position: absolute; right: 20px; top: 378px; width: 44px; height: 44px; border: 0; border-radius: 50%; background: rgba(236,230,242,.1); color: var(--ink); display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
    <span style="position: absolute; left: 24px; top: 24px; font-size: 13px; color: var(--ink-subtle)">2 of 6 in this chat</span>
  </div>

  <aside aria-label="About this picture" style="width: 340px; flex-shrink: 0; box-sizing: border-box; padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 18px; background: var(--surface-card); border-left: 1px solid var(--line)">
    <div style="display: flex; align-items: flex-start; gap: 8px">
      <div style="flex-grow: 1; padding-top: 10px">
        <h1 style="margin: 0 0 4px; font-size: 17px; font-weight: 700">The common room, snowed in</h1>
        <span style="font-size: 13px; color: var(--ink-subtle)">Snowed in at the pass · tonight, 21:14</span>
      </div>
      <button type="button" aria-label="Close" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 10px; background: none; color: var(--ink-muted); display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-subtle)">In the picture</span>
      <div style="display: flex; gap: 8px">
        <span style="height: 36px; padding: 0 12px 0 4px; border-radius: 999px; background: var(--surface-raised); display: flex; align-items: center; gap: 8px; font-size: 14px"><div aria-hidden="true" style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 50%; overflow: hidden; background: linear-gradient(165deg, #4a2a44 0%, #1b1424 100%)"><svg width="28" height="28" viewBox="18 26 84 84" style="display: block"><circle cx="60" cy="60" r="25" fill="rgba(240,115,155,.4)"/><path d="M12 160c4-40 24-62 48-62s44 22 48 62z" fill="rgba(240,115,155,.3)"/></svg></div>Mira</span>
        <span style="height: 36px; padding: 0 12px 0 4px; border-radius: 999px; background: var(--surface-raised); display: flex; align-items: center; gap: 8px; font-size: 14px"><div aria-hidden="true" style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 50%; overflow: hidden; background: linear-gradient(165deg, #24304a 0%, #1b1424 100%)"><svg width="28" height="28" viewBox="18 26 84 84" style="display: block"><circle cx="60" cy="60" r="25" fill="rgba(124,183,255,.4)"/><path d="M12 160c4-40 24-62 48-62s44 22 48 62z" fill="rgba(124,183,255,.3)"/></svg></div>Thorne</span>
      </div>
    </div>

    <details style="border-top: 1px solid var(--line); padding-top: 4px">
      <summary style="height: 44px; display: flex; align-items: center; font-size: 14px; font-weight: 600; color: var(--ink-muted); cursor: pointer">Prompt and settings</summary>
    </details>

    <div style="flex-grow: 1"></div>

    <div style="display: flex; flex-direction: column; border-top: 1px solid var(--line); padding-top: 10px">
      <button type="button" style="height: 44px; padding: 0 12px; border: 0; border-radius: 10px; background: none; color: var(--ink); font: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 12px; text-align: left"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>Draw it again</button>
      <button type="button" style="height: 44px; padding: 0 12px; border: 0; border-radius: 10px; background: none; color: var(--ink); font: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 12px; text-align: left"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>Download</button>
      <button type="button" style="height: 44px; padding: 0 12px; border: 0; border-radius: 10px; background: none; color: var(--error); font: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 12px; text-align: left"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 15h10l1-15"/></svg>Delete</button>
    </div>
  </aside>
</div>
</body>
</html>

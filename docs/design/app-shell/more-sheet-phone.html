<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>More sheet, phone</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&amp;display=swap">
<style>
body{margin:0;background:#0b0910}
:root{--surface-page:#110e17;--surface-card:#1a1622;--surface-raised:#241f2e;--primary:#f0739b;--on-primary:#1d0a13;--accent:#f2b56b;--error:#ff6b7a;--ink:rgba(236,230,242,.92);--ink-muted:rgba(236,230,242,.7);--ink-subtle:rgba(236,230,242,.52);--line:rgba(236,230,242,.12);--line-strong:rgba(236,230,242,.22);--scrim:rgba(5,3,8,.7);--font-ui:'Figtree',system-ui,sans-serif}
a{color:#f0739b}a:hover{color:#f59ab6}
</style>
</head>
<body>
<div style="width: 375px; height: 812px; position: relative; background: var(--surface-page); color: var(--ink); font-family: var(--font-ui); overflow: hidden">

  <div aria-hidden="true" style="box-sizing: border-box; padding: 44px 16px 0; height: 104px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line)">
    <div style="width: 30px; height: 30px; border-radius: 8px; background: var(--primary)"></div>
    <span style="font-size: 22px; font-weight: 700">Chats</span>
  </div>
  <div aria-hidden="true" style="display: flex; flex-direction: column; gap: 22px; padding: 22px 16px">
    <div style="height: 120px; border-radius: 12px; background: var(--surface-card)"></div>
    <div style="height: 44px; border-radius: 10px; background: var(--surface-card)"></div>
    <div style="height: 44px; border-radius: 10px; background: var(--surface-card)"></div>
    <div style="height: 44px; border-radius: 10px; background: var(--surface-card)"></div>
  </div>

  <div style="position: absolute; inset: 0; background: var(--scrim)"></div>

  <section role="dialog" aria-modal="true" aria-labelledby="more-title" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 10px 12px 30px; border-radius: 20px 20px 0 0; background: var(--surface-card); border-top: 1px solid var(--line-strong); display: flex; flex-direction: column; gap: 2px">
    <div aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: var(--line-strong); margin-bottom: 12px"></div>

    <div style="display: flex; align-items: center; gap: 12px; padding: 4px 8px 14px; border-bottom: 1px solid var(--line); margin-bottom: 8px">
      <div style="width: 44px; height: 44px; border-radius: 50%; background: var(--surface-raised); color: var(--accent); display: grid; place-items: center; font-size: 16px; font-weight: 700">S</div>
      <div style="display: flex; flex-direction: column; flex-grow: 1">
        <h2 id="more-title" style="margin: 0; font-size: 17px; font-weight: 600">Sam</h2>
        <span style="font-size: 13px; color: var(--ink-subtle)">sam@[your-domain]</span>
      </div>
      <button type="button" aria-label="Close" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: none; color: var(--ink-muted); display: grid; place-items: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <a href="#" style="display: flex; align-items: center; gap: 14px; height: 52px; padding: 0 10px; border-radius: 10px; color: var(--ink); text-decoration: none; font-size: 16px; font-weight: 500">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--ink-muted)"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg>
      <span style="flex-grow: 1">Personas</span>
      <span style="font-size: 13px; color: var(--ink-subtle)">3</span>
    </a>
    <a href="#" style="display: flex; align-items: center; gap: 14px; height: 52px; padding: 0 10px; border-radius: 10px; color: var(--ink); text-decoration: none; font-size: 16px; font-weight: 500">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--ink-muted)"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M15 2v2M15 20v2M2 15h2M2 9h2M20 15h2M20 9h2M9 2v2M9 20v2"/></svg>
      <span style="flex-grow: 1">Models</span>
    </a>
    <a href="#" style="display: flex; align-items: center; gap: 14px; height: 52px; padding: 0 10px; border-radius: 10px; color: var(--ink); text-decoration: none; font-size: 16px; font-weight: 500">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--ink-muted)"><path d="M9 3h6M10 3v6L4.5 19a1.5 1.5 0 0 0 1.3 2h12.4a1.5 1.5 0 0 0 1.3-2L14 9V3"/><path d="M7 15h10"/></svg>
      <span style="flex-grow: 1">Playground</span>
    </a>
    <a href="#" style="display: flex; align-items: center; gap: 14px; height: 52px; padding: 0 10px; border-radius: 10px; color: var(--ink); text-decoration: none; font-size: 16px; font-weight: 500">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--ink-muted)"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <span style="flex-grow: 1">Account and security</span>
    </a>
    <div style="height: 1px; background: var(--line); margin: 8px 0"></div>
    <button type="button" style="display: flex; align-items: center; gap: 14px; height: 52px; padding: 0 10px; border: 0; border-radius: 10px; background: none; color: var(--error); font: inherit; font-size: 16px; font-weight: 500; text-align: left">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
      Sign out
    </button>
  </section>
</div>
</body>
</html>

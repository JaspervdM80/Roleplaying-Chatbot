<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in, phone</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&amp;display=swap">
<style>
body{margin:0;background:#0b0910}
:root{--surface-page:#110e17;--surface-sunken:#0b0910;--primary:#f0739b;--on-primary:#1d0a13;--ink:rgba(236,230,242,.92);--ink-muted:rgba(236,230,242,.7);--ink-subtle:rgba(236,230,242,.52);--line:rgba(236,230,242,.12);--line-strong:rgba(236,230,242,.22);--font-ui:'Figtree',system-ui,sans-serif;--font-prose:'Atkinson Hyperlegible',system-ui,sans-serif;--ink-soft:rgba(236,230,242,.82)}
a{color:#f0739b}a:hover{color:#f59ab6}
</style>
</head>
<body>
<div style="width: 375px; height: 812px; box-sizing: border-box; padding: 64px 20px 34px; display: flex; flex-direction: column; gap: 32px; background: var(--surface-page); color: var(--ink); font-family: var(--font-ui); overflow: hidden">
  <div style="display: flex; flex-direction: column; gap: 22px">
    <div style="display: flex; align-items: center; gap: 10px">
      <div style="width: 32px; height: 32px; border-radius: 9px; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; font-family: var(--font-prose); font-size: 21px; font-weight: 700; font-style: italic">R</div>
      <span style="font-size: 17px; font-weight: 700; letter-spacing: -.01em">Roleplay Studio</span>
    </div>
    <p style="margin: 0; font-family: var(--font-prose); font-size: 27px; line-height: 1.25; font-weight: 700">Your characters, <em style="color: var(--primary)">your</em> worlds, and a story that remembers.</p>
  </div>

  <form style="display: flex; flex-direction: column; gap: 16px">
    <h1 style="margin: 0; font-size: 22px; font-weight: 700">Sign in</h1>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; color: var(--ink-muted)">
      Email
      <input type="email" autocomplete="username" style="height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface-sunken); color: var(--ink); font: inherit; font-size: 16px; font-weight: 400">
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; color: var(--ink-muted)">
      <span style="display: flex; justify-content: space-between">Password <a href="#" style="font-weight: 500; text-decoration: none">Forgot it?</a></span>
      <input type="password" autocomplete="current-password" style="height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface-sunken); color: var(--ink); font: inherit; font-size: 16px; font-weight: 400">
    </label>
    <label style="display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 15px; color: var(--ink-muted)">
      <input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #f0739b">
      Keep me signed in
    </label>
    <button type="submit" style="height: 50px; border: 0; border-radius: 10px; background: var(--primary); color: var(--on-primary); font: inherit; font-size: 16px; font-weight: 600">Sign in</button>
    <button type="button" style="height: 50px; border: 1px solid var(--line-strong); border-radius: 10px; background: none; color: var(--ink); font: inherit; font-size: 16px; font-weight: 600">Sign in with a passkey</button>
  </form>

  <div style="flex-grow: 1"></div>
  <p style="margin: 0; font-size: 14px; color: var(--ink-subtle); text-align: center">Got an invite code? <a href="#" style="font-weight: 600; text-decoration: none">Create an account</a></p>
</div>
</body>
</html>

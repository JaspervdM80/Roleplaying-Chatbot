<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cast picker, desktop</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&amp;display=swap">
<style>
body{margin:0;background:#0b0910}
:root{--surface-page:#110e17;--surface-card:#1a1622;--surface-raised:#241f2e;--surface-sunken:#0b0910;--primary:#f0739b;--on-primary:#1d0a13;--accent:#f2b56b;--info:#7cb7ff;--error:#ff6b7a;--ink:rgba(236,230,242,.92);--ink-muted:rgba(236,230,242,.7);--ink-subtle:rgba(236,230,242,.52);--ink-faint:rgba(236,230,242,.36);--line:rgba(236,230,242,.12);--line-strong:rgba(236,230,242,.22);--hover:rgba(236,230,242,.06);--selected:rgba(236,230,242,.12);--font-ui:'Figtree',system-ui,sans-serif;--font-prose:'Atkinson Hyperlegible',system-ui,sans-serif;--ink-soft:rgba(236,230,242,.82);--scrim:rgba(5,3,8,.7);--shadow:rgba(0,0,0,.45)}
a{color:#f0739b}a:hover{color:#f59ab6}
</style>
</head>
<body>
<div style="position: relative; width: 1280px; height: 800px; display: flex; background: var(--surface-page); color: var(--ink); font-family: var(--font-ui); overflow: hidden">

  <nav aria-label="Main" style="width: 248px; flex-shrink: 0; box-sizing: border-box; padding: 20px 14px; display: flex; flex-direction: column; gap: 4px; background: var(--surface-card); border-right: 1px solid var(--line)">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 8px 18px">
      <div style="width: 32px; height: 32px; border-radius: 9px; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; font-family: var(--font-prose); font-size: 21px; font-weight: 700; font-style: italic">R</div>
      <span style="font-size: 17px; font-weight: 700; letter-spacing: -.01em">Roleplay Studio</span>
    </div>
    <span style="height: 44px; margin-bottom: 14px; border-radius: 10px; background: var(--primary)"></span>
    <span style="height: 42px; border-radius: 8px; background: var(--hover)"></span>
    <span style="height: 42px; border-radius: 8px; background: var(--selected)"></span>
    <span style="height: 42px; border-radius: 8px; background: var(--hover)"></span>
    <span style="height: 42px; border-radius: 8px; background: var(--hover)"></span>
  </nav>

  <main style="flex-grow: 1; padding: 32px 40px">
    <h1 style="margin: 0 0 24px; font-size: 26px; font-weight: 700">The Lantern Inn</h1>
    <div style="height: 160px; border-radius: 12px; background: var(--surface-card); border: 1px solid var(--line)"></div>
  </main>

  <div style="position: absolute; inset: 0; background: var(--scrim)"></div>

  <section role="dialog" aria-label="Cast" style="position: absolute; left: 340px; top: 40px; width: 600px; height: 720px; display: flex; flex-direction: column; background: var(--surface-card); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 24px 64px var(--shadow); overflow: hidden">

    <header style="flex-shrink: 0; height: 68px; box-sizing: border-box; padding: 0 12px 0 28px; display: flex; align-items: center; gap: 12px">
      <div style="display: flex; flex-direction: column; flex-grow: 1">
        <span style="font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-subtle)">The Lantern Inn</span>
        <h2 style="margin: 0; font-size: 19px; font-weight: 700">Cast</h2>
      </div>
      <button type="button" aria-label="Close" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: none; color: var(--ink-muted); display: grid; place-items: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </header>

    <div style="flex-shrink: 0; padding: 4px 28px 16px; border-bottom: 1px solid var(--line)">
      <label style="display: flex; align-items: center; gap: 10px; height: 44px; box-sizing: border-box; padding: 0 14px; border: 1px solid var(--line-strong); border-radius: 10px; color: var(--ink-subtle)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <span style="font-size: 15px">Find a character</span>
      </label>
    </div>

    <ul style="flex-grow: 1; min-height: 0; overflow: hidden; list-style: none; margin: 0; padding: 16px 28px; display: flex; flex-direction: column; gap: 8px">
        <li style="display: flex; flex-direction: column; border-radius: 12px; background: color-mix(in srgb, var(--primary) 6%, var(--surface-card)); border: 1px solid rgba(240,115,155,.24)">
          <label style="display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 0 16px; cursor: pointer">
            <div aria-hidden="true" style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 50%; overflow: hidden; background: linear-gradient(165deg, #4a2a44 0%, #1b1424 100%)"><svg width="40" height="40" viewBox="18 26 84 84"><circle cx="60" cy="60" r="25" fill="rgba(240,115,155,.4)"/><path d="M12 160c4-40 24-62 48-62s44 22 48 62z" fill="rgba(240,115,155,.3)"/></svg></div>
            <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column">
              <span style="font-size: 15px; font-weight: 600">Mira</span>
              <span style="font-size: 13px; color: var(--ink-subtle); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Keeper of the Lantern Inn. Warm, nosy, never lets a guest go hungry.</span>
            </span>
            <span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 6px; background: var(--primary); display: grid; place-items: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1d0a13" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
          </label>
          <label style="position: relative; display: block; margin: 8px 16px 14px 70px">
            <span style="position: absolute; top: -8px; left: 10px; padding: 0 4px; background: color-mix(in srgb, var(--primary) 6%, var(--surface-card)); font-size: 12px; color: var(--ink-subtle)">Role in this chatbot</span>
            <span style="display: block; box-sizing: border-box; height: 44px; padding: 12px 14px; border: 1px solid var(--line-strong); border-radius: 10px; font-size: 14px;">The innkeeper</span>
          </label>
        </li>
        <li style="display: flex; flex-direction: column; border-radius: 12px; background: color-mix(in srgb, var(--primary) 6%, var(--surface-card)); border: 1px solid rgba(240,115,155,.24)">
          <label style="display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 0 16px; cursor: pointer">
            <div aria-hidden="true" style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 50%; overflow: hidden; background: linear-gradient(165deg, #24304a 0%, #1b1424 100%)"><svg width="40" height="40" viewBox="18 26 84 84"><circle cx="60" cy="60" r="25" fill="rgba(124,183,255,.4)"/><path d="M12 160c4-40 24-62 48-62s44 22 48 62z" fill="rgba(124,183,255,.3)"/></svg></div>
            <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column">
              <span style="font-size: 15px; font-weight: 600">Thorne</span>
              <span style="font-size: 13px; color: var(--ink-subtle); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">A cartographer who has mapped every pass but this one.</span>
            </span>
            <span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 6px; background: var(--primary); display: grid; place-items: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1d0a13" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
          </label>
          <label style="position: relative; display: block; margin: 8px 16px 14px 70px">
            <span style="position: absolute; top: -8px; left: 10px; padding: 0 4px; background: color-mix(in srgb, var(--primary) 6%, var(--surface-card)); font-size: 12px; color: var(--ink-subtle)">Role in this chatbot</span>
            <span style="display: block; box-sizing: border-box; height: 44px; padding: 12px 14px; border: 1px solid var(--line-strong); border-radius: 10px; font-size: 14px;">Stranded traveller</span>
          </label>
        </li>
        <li style="display: flex; flex-direction: column; border-radius: 12px; background: color-mix(in srgb, var(--primary) 6%, var(--surface-card)); border: 1px solid rgba(240,115,155,.24)">
          <label style="display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 0 16px; cursor: pointer">
            <div aria-hidden="true" style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 50%; background: rgba(242,181,107,.18); color: rgb(242,181,107); display: grid; place-items: center; font-size: 15px; font-weight: 700">B</div>
            <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column">
              <span style="font-size: 15px; font-weight: 600">Old Bess</span>
              <span style="font-size: 13px; color: var(--ink-subtle); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Cook, gossip, and the only one who knows where the key is.</span>
            </span>
            <span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 6px; background: var(--primary); display: grid; place-items: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1d0a13" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
          </label>
          <label style="position: relative; display: block; margin: 8px 16px 14px 70px">
            <span style="position: absolute; top: -8px; left: 10px; padding: 0 4px; background: color-mix(in srgb, var(--primary) 6%, var(--surface-card)); font-size: 12px; color: var(--ink-subtle)">Role in this chatbot</span>
            <span style="display: block; box-sizing: border-box; height: 44px; padding: 12px 14px; border: 1px solid var(--line-strong); border-radius: 10px; font-size: 14px; color: var(--ink-faint);">Optional, like "the cook"</span>
          </label>
        </li>
        <li style="display: flex; flex-direction: column; border-radius: 12px; border: 1px solid var(--line)">
          <label style="display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 0 16px; cursor: pointer">
            <div aria-hidden="true" style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 50%; background: rgba(95,211,154,.18); color: rgb(95,211,154); display: grid; place-items: center; font-size: 15px; font-weight: 700">K</div>
            <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column">
              <span style="font-size: 15px; font-weight: 600">Kit</span>
              <span style="font-size: 13px; color: var(--ink-subtle); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">A pickpocket with a conscience she would rather not have.</span>
            </span>
            <span aria-hidden="true" style="width: 22px; height: 22px; box-sizing: border-box; border-radius: 6px; border: 2px solid var(--line-strong)"></span>
          </label>
        </li>
        <li style="display: flex; flex-direction: column; border-radius: 12px; border: 1px solid var(--line)">
          <label style="display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 0 16px; cursor: pointer">
            <div aria-hidden="true" style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 50%; overflow: hidden; background: linear-gradient(165deg, #3a2a4a 0%, #1b1424 100%)"><svg width="40" height="40" viewBox="18 26 84 84"><circle cx="60" cy="60" r="25" fill="rgba(190,160,255,.4)"/><path d="M12 160c4-40 24-62 48-62s44 22 48 62z" fill="rgba(190,160,255,.3)"/></svg></div>
            <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column">
              <span style="font-size: 15px; font-weight: 600">Sable</span>
              <span style="font-size: 13px; color: var(--ink-subtle); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Court musician on the run from a very small scandal.</span>
            </span>
            <span aria-hidden="true" style="width: 22px; height: 22px; box-sizing: border-box; border-radius: 6px; border: 2px solid var(--line-strong)"></span>
          </label>
        </li>
    </ul>

    <footer style="flex-shrink: 0; height: 72px; box-sizing: border-box; padding: 0 24px 0 28px; display: flex; align-items: center; gap: 12px; border-top: 1px solid var(--line)">
      <span style="flex-grow: 1; font-size: 14px; color: var(--ink-muted)">3 in the cast</span>
      <button type="button" style="height: 44px; padding: 0 18px; border: 0; border-radius: 10px; background: none; color: var(--ink-muted); font: inherit; font-size: 15px; font-weight: 600">Cancel</button>
      <button type="button" style="height: 44px; padding: 0 24px; border: 0; border-radius: 10px; background: var(--primary); color: var(--on-primary); font: inherit; font-size: 15px; font-weight: 600">Save</button>
    </footer>
  </section>
</div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Character editor, desktop</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&amp;display=swap">
<style>
body{margin:0;background:#0b0910}
:root{--surface-page:#110e17;--surface-card:#1a1622;--surface-raised:#241f2e;--surface-sunken:#0b0910;--primary:#f0739b;--on-primary:#1d0a13;--accent:#f2b56b;--info:#7cb7ff;--error:#ff6b7a;--ink:rgba(236,230,242,.92);--ink-muted:rgba(236,230,242,.7);--ink-subtle:rgba(236,230,242,.52);--ink-faint:rgba(236,230,242,.36);--line:rgba(236,230,242,.12);--line-strong:rgba(236,230,242,.22);--hover:rgba(236,230,242,.06);--selected:rgba(236,230,242,.12);--font-ui:'Figtree',system-ui,sans-serif;--font-prose:'Atkinson Hyperlegible',system-ui,sans-serif;--ink-soft:rgba(236,230,242,.82)}
a{color:#f0739b}a:hover{color:#f59ab6}
</style>
</head>
<body>
<div style="position: relative; width: 1280px; height: 800px; display: flex; background: var(--surface-page); color: var(--ink); font-family: var(--font-ui); overflow: hidden">

  <nav aria-label="Main" style="width: 248px; flex-shrink: 0; box-sizing: border-box; padding: 20px 14px; display: flex; flex-direction: column; gap: 4px; background: var(--surface-card); border-right: 1px solid var(--line)">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 8px 18px">
      <div style="width: 32px; height: 32px; border-radius: 9px; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; font-family: var(--font-prose); font-size: 21px; font-weight: 700; font-style: italic">R</div>
      <span style="font-size: 17px; font-weight: 700; letter-spacing: -.01em">Roleplay Studio</span>
    </div>
    <span style="height: 44px; margin-bottom: 14px; border-radius: 10px; background: var(--primary)"></span>
    <span style="height: 42px; border-radius: 8px; background: var(--hover)"></span>
    <span style="height: 42px; border-radius: 8px; background: var(--hover)"></span>
    <span style="height: 42px; border-radius: 8px; background: var(--selected)"></span>
    <span style="height: 42px; border-radius: 8px; background: var(--hover)"></span>
  </nav>

  <main style="flex-grow: 1; padding: 32px 40px">
    <h1 style="margin: 0 0 24px; font-size: 26px; font-weight: 700">Characters</h1>
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px">
      <div style="height: 120px; border-radius: 12px; background: var(--surface-card); border: 1px solid var(--line)"></div>
      <div style="height: 120px; border-radius: 12px; background: var(--surface-card); border: 1px solid var(--line)"></div>
      <div style="height: 120px; border-radius: 12px; background: var(--surface-card); border: 1px solid var(--line)"></div>
    </div>
  </main>

  <div style="position: absolute; inset: 0; background: rgba(5,4,8,.66)"></div>

  <section role="dialog" aria-label="Edit character" style="position: absolute; left: 160px; top: 40px; width: 960px; height: 720px; display: flex; flex-direction: column; background: var(--surface-card); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 24px 64px rgba(0,0,0,.5); overflow: hidden">

    <header style="flex-shrink: 0; height: 68px; box-sizing: border-box; padding: 0 12px 0 28px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--line)">
      <div style="display: flex; flex-direction: column; flex-grow: 1">
        <span style="font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-subtle)">Character</span>
        <h2 style="margin: 0; font-size: 19px; font-weight: 700">Mira</h2>
      </div>
      <button type="button" aria-label="Close" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: none; color: var(--ink-muted); display: grid; place-items: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </header>

    <div style="flex-grow: 1; min-height: 0; display: flex">

      <aside style="width: 228px; flex-shrink: 0; box-sizing: border-box; padding: 24px; display: flex; flex-direction: column; gap: 10px; border-right: 1px solid var(--line)">
        <div aria-label="Reference portrait" style="position: relative; flex-shrink: 0; width: 180px; height: 240px; border-radius: 12px; overflow: hidden; background: linear-gradient(165deg, #4a2a44 0%, #241a2e 55%, #17121f 100%)">
          <svg width="180" height="240" viewBox="0 0 120 160" aria-hidden="true" style="position: absolute; inset: 0"><circle cx="60" cy="60" r="25" fill="rgba(240,115,155,.32)"/><path d="M12 160c4-40 24-62 48-62s44 22 48 62z" fill="rgba(240,115,155,.24)"/></svg>
          <span style="position: absolute; left: 10px; top: 10px; height: 24px; padding: 0 8px; border-radius: 999px; background: rgba(17,14,23,.78); color: var(--ink); font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 5px">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="#f2b56b" aria-hidden="true"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg>
            Reference
          </span>
        </div>
        <div style="display: flex; gap: 8px">
          <button type="button" style="flex-grow: 1; height: 44px; border: 0; border-radius: 10px; background: rgba(240,115,155,.14); color: var(--primary); font: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></svg>
            Generate
          </button>
          <button type="button" aria-label="Choose from pictures" style="width: 44px; height: 44px; flex-shrink: 0; border: 1px solid var(--line); border-radius: 10px; background: none; color: var(--ink-muted); display: grid; place-items: center">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>
          </button>
        </div>

        <nav aria-label="Sections" style="margin-top: 8px; display: flex; flex-direction: column">
          <a href="#identity" aria-current="true" style="height: 44px; padding: 0 12px; border-radius: 8px; background: var(--selected); color: var(--ink); text-decoration: none; font-size: 14px; font-weight: 600; display: flex; align-items: center">Identity</a>
          <a href="#voice" style="height: 44px; padding: 0 12px; border-radius: 8px; color: var(--ink-muted); text-decoration: none; font-size: 14px; font-weight: 500; display: flex; align-items: center">Personality and voice</a>
          <a href="#appearance" style="height: 44px; padding: 0 12px; border-radius: 8px; color: var(--ink-muted); text-decoration: none; font-size: 14px; font-weight: 500; display: flex; align-items: center">Appearance</a>
          <a href="#outfit" style="height: 44px; padding: 0 12px; border-radius: 8px; color: var(--ink-muted); text-decoration: none; font-size: 14px; font-weight: 500; display: flex; align-items: center">Default outfit</a>
          <a href="#images" style="height: 44px; padding: 0 12px; border-radius: 8px; color: var(--ink-muted); text-decoration: none; font-size: 14px; font-weight: 500; display: flex; align-items: center">Image settings</a>
        </nav>
      </aside>

      <div style="position: relative; flex-grow: 1; min-width: 0; overflow: hidden; box-sizing: border-box; padding: 28px 40px 0 36px; display: flex; flex-direction: column; gap: 36px">

        <section id="identity" style="display: flex; flex-direction: column; gap: 20px">
          <h3 style="margin: 0; font-size: 16px; font-weight: 700">Identity</h3>
          <label style="position: relative; display: block">
            <span style="position: absolute; top: -8px; left: 10px; padding: 0 4px; background: var(--surface-card); font-size: 12px; color: var(--ink-subtle)">Name *</span>
            <span style="display: block; box-sizing: border-box; height: 52px; padding: 15px 14px; border: 1px solid var(--line-strong); border-radius: 10px; font-size: 15px">Mira</span>
          </label>
          <div style="display: flex; gap: 16px">
            <label style="position: relative; display: block; width: 140px">
              <span style="position: absolute; top: -8px; left: 10px; padding: 0 4px; background: var(--surface-card); font-size: 12px; color: var(--ink-subtle)">Age</span>
              <span style="display: block; box-sizing: border-box; height: 52px; padding: 15px 14px; border: 1px solid var(--line-strong); border-radius: 10px; font-size: 15px">34</span>
            </label>
            <label style="position: relative; display: block; flex-grow: 1">
              <span style="position: absolute; top: -8px; left: 10px; padding: 0 4px; background: var(--surface-card); font-size: 12px; color: var(--ink-subtle)">Gender</span>
              <span style="display: block; box-sizing: border-box; height: 52px; padding: 15px 14px; border: 1px solid var(--line-strong); border-radius: 10px; font-size: 15px">Woman</span>
            </label>
          </div>
          <label style="position: relative; display: block">
            <span style="position: absolute; top: -8px; left: 10px; padding: 0 4px; background: var(--surface-card); font-size: 12px; color: var(--primary)">In a sentence</span>
            <span style="display: block; box-sizing: border-box; min-height: 76px; padding: 14px; border: 2px solid var(--primary); border-radius: 10px; font-size: 15px; line-height: 1.5">Keeper of the Lantern Inn. Warm, nosy, and never lets a guest go to bed hungry.|</span>
            <span style="display: block; margin: 6px 14px 0; font-size: 12px; color: var(--ink-subtle)">Shown in lists and given to the model first.</span>
          </label>
        </section>

        <section id="voice" style="display: flex; flex-direction: column; gap: 20px">
          <h3 style="margin: 0; font-size: 16px; font-weight: 700">Personality and voice</h3>
          <label style="position: relative; display: block">
            <span style="position: absolute; top: -8px; left: 10px; padding: 0 4px; background: var(--surface-card); font-size: 12px; color: var(--ink-subtle)">Personality</span>
            <span style="display: block; box-sizing: border-box; min-height: 100px; padding: 14px; border: 1px solid var(--line-strong); border-radius: 10px; font-size: 15px; line-height: 1.5">Runs the inn like a ship. Teases the regulars, mothers the strays, and remembers every debt down to the copper.</span>
          </label>
          <label style="position: relative; display: block">
            <span style="position: absolute; top: -8px; left: 10px; padding: 0 4px; background: var(--surface-card); font-size: 12px; color: var(--ink-subtle)">Speech style</span>
            <span style="display: block; box-sizing: border-box; min-height: 76px; padding: 14px; border: 1px solid var(--line-strong); border-radius: 10px; font-size: 15px; line-height: 1.5">Dry humour, short sentences, calls everyone "love".</span>
          </label>
        </section>

        <div style="position: absolute; right: 6px; top: 8px; width: 4px; height: 180px; border-radius: 2px; background: var(--line-strong)"></div>
      </div>
    </div>

    <footer style="flex-shrink: 0; height: 72px; box-sizing: border-box; padding: 0 24px 0 28px; display: flex; align-items: center; gap: 12px; border-top: 1px solid var(--line)">
      <span style="flex-grow: 1; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-subtle)">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: var(--accent)"></span>
        Unsaved changes
      </span>
      <button type="button" style="height: 44px; padding: 0 18px; border: 0; border-radius: 10px; background: none; color: var(--ink-muted); font: inherit; font-size: 15px; font-weight: 600">Cancel</button>
      <button type="button" style="height: 44px; padding: 0 24px; border: 0; border-radius: 10px; background: var(--primary); color: var(--on-primary); font: inherit; font-size: 15px; font-weight: 600">Save</button>
    </footer>
  </section>
</div>
</body>
</html>

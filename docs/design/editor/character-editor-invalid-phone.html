<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Character editor, save blocked, phone</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&amp;display=swap">
<style>
body{margin:0;background:#0b0910}
:root{--surface-page:#110e17;--surface-card:#1a1622;--surface-raised:#241f2e;--primary:#f0739b;--on-primary:#1d0a13;--accent:#f2b56b;--info:#7cb7ff;--error:#ff6b7a;--ink:rgba(236,230,242,.92);--ink-muted:rgba(236,230,242,.7);--ink-subtle:rgba(236,230,242,.52);--line:rgba(236,230,242,.12);--line-strong:rgba(236,230,242,.22);--selected:rgba(236,230,242,.12);--font-ui:'Figtree',system-ui,sans-serif;--font-prose:'Atkinson Hyperlegible',system-ui,sans-serif;--ink-soft:rgba(236,230,242,.82)}
a{color:#f0739b}a:hover{color:#f59ab6}
</style>
</head>
<body>
<div role="dialog" aria-label="Edit character" style="width: 375px; height: 812px; display: flex; flex-direction: column; background: var(--surface-card); color: var(--ink); font-family: var(--font-ui); overflow: hidden">

  <header style="flex-shrink: 0; height: 104px; box-sizing: border-box; padding: 44px 4px 0 4px; display: flex; align-items: center; gap: 4px">
    <button type="button" aria-label="Close" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: none; color: var(--ink-muted); display: grid; place-items: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <div style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0">
      <span style="font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-subtle)">Character</span>
      <h1 style="margin: 0; font-size: 17px; font-weight: 700; color: var(--ink-subtle)">New character</h1>
    </div>
  </header>

  <nav aria-label="Sections" style="flex-shrink: 0; display: flex; gap: 8px; padding: 0 16px 10px; overflow: hidden; border-bottom: 1px solid var(--line)">
    <a href="#identity" aria-current="true" style="flex-shrink: 0; height: 44px; padding: 0 16px; border-radius: 999px; background: var(--selected); color: var(--ink); text-decoration: none; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px"><span aria-label="Has a problem" style="width: 8px; height: 8px; border-radius: 50%; background: var(--error)"></span>Identity</a>
    <a href="#voice" style="flex-shrink: 0; height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); box-sizing: border-box; color: var(--ink-muted); text-decoration: none; font-size: 14px; font-weight: 500; display: flex; align-items: center">Personality</a>
    <a href="#appearance" style="flex-shrink: 0; height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); box-sizing: border-box; color: var(--ink-muted); text-decoration: none; font-size: 14px; font-weight: 500; display: flex; align-items: center">Appearance</a>
    <a href="#outfit" style="flex-shrink: 0; height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); box-sizing: border-box; color: var(--ink-muted); text-decoration: none; font-size: 14px; font-weight: 500; display: flex; align-items: center">Outfit</a>
  </nav>

  <div style="flex-grow: 1; min-height: 0; overflow: hidden; box-sizing: border-box; padding: 20px 16px 0; display: flex; flex-direction: column; gap: 20px">

    <div style="display: flex; gap: 14px; align-items: stretch">
      <div aria-label="No portrait yet" style="flex-shrink: 0; width: 96px; height: 128px; box-sizing: border-box; border: 1px dashed var(--line-strong); border-radius: 10px; color: var(--ink-subtle); display: grid; place-items: center">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg>
      </div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 8px">
        <button type="button" disabled style="height: 44px; border: 0; border-radius: 10px; background: rgba(236,230,242,.06); opacity: .6; color: var(--ink-subtle); font: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></svg>
          Generate portrait
        </button>
        <span style="font-size: 12px; line-height: 1.4; color: var(--ink-subtle)">Save first. The portrait is drawn from the appearance you fill in.</span>
              </div>
    </div>

    <section id="identity" style="display: flex; flex-direction: column; gap: 20px">
      <h2 style="margin: 0; font-size: 16px; font-weight: 700">Identity</h2>
      <label style="position: relative; display: block">
        <span style="position: absolute; top: -8px; left: 10px; padding: 0 4px; background: var(--surface-card); font-size: 12px; color: var(--error)">Name *</span>
        <span aria-invalid="true" style="display: block; box-sizing: border-box; height: 52px; padding: 15px 14px; border: 2px solid var(--error); border-radius: 10px; font-size: 16px">|</span>
        <span role="alert" style="display: block; margin: 6px 14px 0; font-size: 12px; color: var(--error)">Give the character a name</span>
      </label>
      <div style="display: flex; gap: 12px">
        <label style="position: relative; display: block; width: 104px">
          <span style="position: absolute; top: -8px; left: 10px; padding: 0 4px; background: var(--surface-card); font-size: 12px; color: var(--ink-subtle)">Age</span>
          <span style="display: block; box-sizing: border-box; height: 52px; padding: 15px 14px; border: 1px solid var(--line-strong); border-radius: 10px; font-size: 16px">30</span>
        </label>
        <label style="position: relative; display: block; flex-grow: 1">
          <span style="position: absolute; top: -8px; left: 10px; padding: 0 4px; background: var(--surface-card); font-size: 12px; color: var(--ink-subtle)">Gender</span>
          <span style="display: block; box-sizing: border-box; height: 52px; padding: 15px 14px; border: 1px solid var(--line-strong); border-radius: 10px; font-size: 16px">Man</span>
        </label>
      </div>
      <label style="position: relative; display: block">
        <span style="position: absolute; top: -8px; left: 10px; padding: 0 4px; background: var(--surface-card); font-size: 12px; color: var(--ink-subtle)">In a sentence</span>
        <span style="display: block; box-sizing: border-box; min-height: 100px; padding: 14px; border: 1px solid var(--line-strong); border-radius: 10px; font-size: 16px; line-height: 1.5">A cartographer who has mapped every pass but this one.</span>
        <span style="display: block; margin: 6px 14px 0; font-size: 12px; color: var(--ink-subtle)">Shown in lists and given to the model first.</span>
      </label>
    </section>

    <section id="voice" style="display: flex; flex-direction: column; gap: 20px">
      <h2 style="margin: 0; font-size: 16px; font-weight: 700">Personality and voice</h2>
      <label style="position: relative; display: block">
        <span style="position: absolute; top: -8px; left: 10px; padding: 0 4px; background: var(--surface-card); font-size: 12px; color: var(--ink-subtle)">Personality</span>
        <span style="display: block; box-sizing: border-box; min-height: 100px; padding: 14px; border: 1px solid var(--line-strong); border-radius: 10px; font-size: 16px; line-height: 1.5">Quiet, precise, slow to trust.</span>
      </label>
    </section>
  </div>

  <footer style="flex-shrink: 0; box-sizing: border-box; padding: 12px 16px calc(12px + 22px); display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--line); background: var(--surface-card)">
    <button type="button" style="flex: 1 1 0; height: 48px; border: 1px solid var(--line-strong); border-radius: 10px; background: none; color: var(--ink); font: inherit; font-size: 16px; font-weight: 600">Cancel</button>
    <button type="button" style="flex: 1 1 0; height: 48px; border: 0; border-radius: 10px; background: var(--primary); color: var(--on-primary); font: inherit; font-size: 16px; font-weight: 600">Save</button>
  </footer>
</div>
</body>
</html>
